# permissions for end users to view ephemeralenvs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ephemeral-env-operator
    app.kubernetes.io/managed-by: kustomize
  name: ephemeralenv-viewer-role
rules:
- apiGroups:
  - apps.myrepo.dev
  resources:
  - ephemeralenvs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.myrepo.dev
  resources:
  - ephemeralenvs/status
  verbs:
  - get
